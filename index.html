<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Bouncy Sim</title>
</head>
<body>
    <h1>Main Tab</h1>
    <h2>Bounces: <span id="bounces">-</span></h2>
    <h2># of Balls: <span id="balls">-</span></h2>
    <h2># of Ball Upgrades: </h2>
    <div class="btn-container">
        <a class="btn" onclick="addBall()">Buy a Ball</a>
    </div>
    <div class="btn-container">
        <a class="btn" onclick="upgradeBallColor()">Upgrade Color</a>
    </div>
    <div class="btn-container">
        <a class="btn" onclick="upgradeBallSize()">Upgrade Size</a>
    </div>
    <script src="script.js"></script>
</body>
</html>
