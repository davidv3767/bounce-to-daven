<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Bouncy Sim</title>
</head>
<body>
    <nav class="menu">
        <ul>
            <li><a href="index.html">Main Tab</a></li>
            <li><a href="bouncfinity.html">Bouncfinity Tab</a></li>
        </ul>
    </nav>
    <h2>Bouncfinities (β): <span id="bouncfinities">0</span></h2>
    <h2>βP: <span id="βp">0</span></h2>
    <div class="btn-container">
        <a class="btn" onclick="βPupgrade(0)">Upgrade Bounce Gain</a>
    </div>
    <div class="btn-container">
        <a class="btn" onclick="βPupgrade(1)">Upgrade Bounce Speed</a>
    </div>
    <div class="btn-container">
        <a class="btn" onclick="βPupgrade(2)">Upgrade βp Gain</a>
    </div>
    <div class="btn-container">
        <a class="btn" onclick="doβchallenge()">Do β Challenge</a>
    </div>
    <hr style="width: 50%; margin: 20px auto;">
    <h2>Gold Balls: <span id="gold-balls-count">0</span></h2>
    <div id="gold-ball-display" style="display: flex; gap: 10px; align-items: center; justify-content: center; min-height: 50px; margin: 10px 0;"></div>
    
    <div class="btn-container">
        <a class="btn" onclick="buyGoldBall()">Buy Gold Ball (Cost: <span id="gold-ball-cost">100</span> βP)</a>
    </div>
    <div class="btn-container">
        <a class="btn" onclick="upgradeGoldBallColor()">Upgrade Gold Ball Color</a>
    </div>
    <div class="btn-container">
        <a class="btn" onclick="upgradeGoldBallSize()">Upgrade Gold Ball Size</a>
    </div>
    <script src="script.js"></script>
</body>
</html>
